name: CI/CD Seika Monorepo Local Deploy

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout mã nguồn mới nhất
        uses: actions/checkout@v5

      - name: Cau hinh moi truong
        run: |
          git config --global --add safe.directory "${{ github.workspace }}"
          cp "F:\Microservices Projects\Seika\.env" .
          echo "Da dong bo file .env thanh cong!"

      - name: Build images tuan tu (tranh OOM)
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
          DOCKER_BUILDKIT: "1"
        run: |
          $services = @(
            "eureka",
            "config-service",
            "identity-service",
            "profile-service",
            "wallet-service",
            "marketplace-service",
            "notification-service",
            "flashcard-service",
            "quiz-service",
            "reward-service",
            "api-gateway"
          )
          foreach ($svc in $services) {
            echo "========== Building $svc =========="
            docker compose -f docker-compose.prod.yml build $svc
            if ($LASTEXITCODE -ne 0) {
              echo "FAILED to build $svc"
              exit 1
            }
            echo "========== Done $svc =========="
          }
          echo "Tat ca images da build thanh cong!"

      - name: Khoi dong he thong Microservices
        run: |
          docker compose -f docker-compose.prod.yml up -d
          echo "He thong da duoc cap nhat"